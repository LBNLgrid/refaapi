site_name: REFA API
site_description: REFA API - Reconductoring Economic and Financial Analysis web API
site_url: https://lbnlgrid.github.io/refaapi
repo_url: https://github.com/LBNLgrid/refaapi
repo_name: LBNLgrid/refaapi

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - REFA Module: https://lbnlgrid.github.io/refamodule/
  - REFA API:
    - Overview: index.md
    - API Access: api-access.md
    - Unit Systems: unit-systems.md
    - Payload Structure: payload.md
    - Notes: notes.md
